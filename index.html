<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yip Kai Men is a Singapore-based data scientist working across agentic AI, machine learning, and applied engineering."
    />
    <meta name="theme-color" content="#f8f9fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <title>Yip Kai Men — Data Scientist</title>
    <!-- Prevent flash of unstyled content: apply dark class before first paint -->
    <script>
      (function () {
        try {
          const stored = localStorage.getItem('theme-storage')
          if (stored) {
            const { state } = JSON.parse(stored)
            if (state && state.theme === 'dark') {
              document.documentElement.classList.add('dark')
            }
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
